# The mdatp package's %pre scriptlet is supposed to create this account with
# useradd. That does not happen in a container build, and without the account
# the installer decides /var is unusable and relocates its log directory into
# /opt/microsoft/mdatp/log, which is read-only on a deployed bootc host.
#
# The UID is fixed so image builds are reproducible. Microsoft's prerequisites
# page notes the account is otherwise created with random UID and GID values
# and suggests pre-creating it if you want to control them.
u mdatp 972 "Microsoft Defender for Endpoint" - /sbin/nologin
