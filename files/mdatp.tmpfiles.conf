# Writable state and log directories for Microsoft Defender for Endpoint.
#
# Content an image places in /var is applied when the host is installed and
# not on subsequent upgrades, so these entries are what keep the directories
# present over the life of the host.
d /var/opt/microsoft 0755 root root -
d /var/opt/microsoft/mdatp 0755 root root -
d /var/opt/microsoft/mdatp/wdavdiag 0755 root root -
d /var/opt/microsoft/mdatp/crash 0755 root root -
d /var/log/microsoft 0755 root root -
d /var/log/microsoft/mdatp 0775 root mdatp -
